<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <title>ZephyrMail | Media Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #00ffcc; font-family: 'Courier New', Courier, monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: rgba(10, 10, 12, 0.95); border-right: 1px solid #00ffcc; display: flex; flex-direction: column; padding: 20px; box-shadow: 2px 0 15px rgba(0, 255, 204, 0.1); }
        .sidebar-logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
        .logo-img { width: 40px; height: 40px; margin-bottom: 8px; filter: drop-shadow(0 0 6px rgba(0, 255, 204, 0.5)); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5em; text-align: center; text-shadow: 0 0 8px rgba(0, 255, 204, 0.5); letter-spacing: 2px; }
        .nav-item { padding: 15px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; text-decoration: none; color: #00ffcc; display: block; }
        .nav-item:hover, .nav-item.active { border: 1px solid #00ffcc; background-color: rgba(0, 255, 204, 0.1); }
        .logout-btn { margin-top: auto; padding: 15px; background-color: rgba(255, 51, 51, 0.1); color: #ff3333; border: 1px solid #ff3333; text-align: center; cursor: pointer; text-decoration: none; font-weight: bold; transition: all 0.2s; }
        .logout-btn:hover { background-color: #ff3333; color: #050505; box-shadow: 0 0 10px rgba(255, 51, 51, 0.5); }
        .main-content { flex-grow: 1; padding: 30px; display: flex; flex-direction: column; overflow-y: auto; background-image: linear-gradient(rgba(0, 255, 204, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .module-container { flex-grow: 1; border: 1px solid #333; background-color: rgba(10, 10, 12, 0.8); padding: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; color: #555; font-size: 0.8em; }
        tr:hover { background-color: rgba(0, 255, 204, 0.05); }
        .empty-state { color: #555; text-align: center; margin-top: 30px; }
        .file-size { color: #555; font-size: 0.85em; }
        .flag-warning { color: #ffcc00; font-size: 0.8em; font-weight: bold; }
        .mime-tag { color: #555; font-size: 0.8em; border: 1px solid #333; padding: 2px 6px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo-wrap">
        <img src="/icons/icon-192.png" alt="ZephyrMail" class="logo-img">
        <div class="logo">ZephyrMail</div>
    </div>
    <a th:href="@{/inbox}" class="nav-item">INBOX</a>
    <a th:href="@{/compose}" class="nav-item">COMPOSE</a>
    <a th:href="@{/contacts}" class="nav-item">CONTACTS</a>
    <a th:href="@{/aliases}" class="nav-item">ALIASES</a>
    <a th:href="@{/vault}" class="nav-item active">VAULT</a>
    <a th:href="@{/settings}" class="nav-item">SETTINGS</a>
    <a th:href="@{/logout}" class="logout-btn">TERMINATE SESSION</a>
</div>

<div class="main-content">
    <div class="header-bar">
        <h2>> MEDIA_VAULT: ONLINE</h2>
        <span style="font-size: 0.8em; color: #555;">ALL RECEIVED ATTACHMENTS</span>
    </div>

    <div class="module-container">
        <h3>> ATTACHMENT ARCHIVE</h3>

        <div th:if="${attachments.empty}" class="empty-state">
            [NO ATTACHMENTS IN VAULT]
        </div>

        <table th:unless="${attachments.empty}">
            <thead>
            <tr>
                <th>FILENAME</th>
                <th>TYPE</th>
                <th>SIZE</th>
                <th>RECEIVED</th>
                <th>STATUS</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="attachment : ${attachments}">
                <td th:text="${attachment.fileName}">filename.pdf</td>
                <td>
                    <span class="mime-tag" th:text="${attachment.mimeType}">application/pdf</span>
                </td>
                <td class="file-size"
                    th:text="${#numbers.formatDecimal(attachment.fileSize / 1024.0, 1, 1)} + ' KB'">
                    0 KB
                </td>
                <td th:text="${#temporals.format(attachment.uploadedAt, 'yyyy-MM-dd HH:mm')}">
                    2026-01-01
                </td>
                <td>
                    <span th:if="${attachment.flaggedUnchecked}"
                          class="flag-warning">⚠ UNCHECKED</span>
                    <span th:unless="${attachment.flaggedUnchecked}"
                          style="color: #00ffcc; font-size: 0.8em;">[CLEAR]</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
