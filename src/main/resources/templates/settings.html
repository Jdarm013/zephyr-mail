<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <title>ZephyrMail | Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #00ffcc; font-family: 'Courier New', Courier, monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: rgba(10, 10, 12, 0.95); border-right: 1px solid #00ffcc; display: flex; flex-direction: column; padding: 20px; box-shadow: 2px 0 15px rgba(0, 255, 204, 0.1); }
        .sidebar-logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
        .logo-img { width: 40px; height: 40px; margin-bottom: 8px; filter: drop-shadow(0 0 6px rgba(0, 255, 204, 0.5)); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5em; text-align: center; text-shadow: 0 0 8px rgba(0, 255, 204, 0.5); letter-spacing: 2px; }
        .nav-item { padding: 15px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; text-decoration: none; color: #00ffcc; display: block; }
        .nav-item:hover, .nav-item.active { border: 1px solid #00ffcc; background-color: rgba(0, 255, 204, 0.1); }
        .logout-btn { margin-top: auto; padding: 15px; background-color: rgba(255, 51, 51, 0.1); color: #ff3333; border: 1px solid #ff3333; text-align: center; cursor: pointer; text-decoration: none; font-weight: bold; transition: all 0.2s; }
        .logout-btn:hover { background-color: #ff3333; color: #050505; }
        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; background-image: linear-gradient(rgba(0, 255, 204, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .module-container { border: 1px solid #333; background-color: rgba(10, 10, 12, 0.8); padding: 30px; max-width: 500px; }
        .module-title { font-family: 'Orbitron', sans-serif; font-size: 0.85em; color: #555; letter-spacing: 2px; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .field-group { margin-bottom: 20px; }
        label { font-size: 0.85em; letter-spacing: 1px; display: block; margin-bottom: 6px; color: #555; }
        input[type="password"] { width: 100%; padding: 12px; background-color: #0a0a0c; border: 1px solid #333; color: #00ffcc; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; transition: border 0.3s; }
        input[type="password"]:focus { outline: none; border-color: #00ffcc; box-shadow: 0 0 6px rgba(0, 255, 204, 0.2); }
        .submit-btn { width: 100%; padding: 14px; background-color: rgba(0, 255, 204, 0.1); color: #00ffcc; border: 1px solid #00ffcc; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 0.85em; letter-spacing: 2px; transition: all 0.2s; margin-top: 10px; }
        .submit-btn:hover { background-color: #00ffcc; color: #050505; box-shadow: 0 0 12px rgba(0, 255, 204, 0.4); }
        .alert-error { border: 1px solid #ff3333; color: #ff3333; background-color: rgba(255, 51, 51, 0.05); padding: 12px; margin-bottom: 20px; font-size: 0.85em; }
        .alert-success { border: 1px solid #00ffcc; color: #00ffcc; background-color: rgba(0, 255, 204, 0.05); padding: 12px; margin-bottom: 20px; font-size: 0.85em; }
        .account-info { color: #555; font-size: 0.8em; margin-bottom: 25px; }
        .account-info span { color: #00ffcc; }
        .hint { font-size: 0.72em; color: #444; margin-top: 4px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo-wrap">
        <img src="/icons/icon-192.png" alt="ZephyrMail" class="logo-img">
        <div class="logo">ZephyrMail</div>
    </div>
    <a th:href="@{/inbox}"    class="nav-item">INBOX</a>
    <a th:href="@{/compose}"  class="nav-item">COMPOSE</a>
    <a th:href="@{/contacts}" class="nav-item">CONTACTS</a>
    <a th:href="@{/aliases}"  class="nav-item">ALIASES</a>
    <a th:href="@{/vault}"    class="nav-item">VAULT</a>
    <a th:href="@{/settings}" class="nav-item active">SETTINGS</a>
    <a th:href="@{/logout}"   class="logout-btn">TERMINATE SESSION</a>
</div>

<div class="main-content">
    <div class="header-bar">
        <h2>> ACCOUNT SETTINGS</h2>
    </div>

    <div class="module-container">
        <div class="module-title">CHANGE PASSWORD</div>

        <div class="account-info">
            ACCOUNT: <span th:text="${user.emailAddress}">user@zephyrlink.net</span>
        </div>

        <div th:if="${error}" class="alert-error">
            [!] <span th:text="${error}">Error message</span>
        </div>

        <div th:if="${success}" class="alert-success">
            [✓] <span th:text="${success}">Success message</span>
        </div>

        <form th:action="@{/settings/password}" method="POST">

            <div class="field-group">
                <label>CURRENT PASSWORD</label>
                <input type="password" name="currentPassword" required autocomplete="current-password">
            </div>

            <div class="field-group">
                <label>NEW PASSWORD</label>
                <input type="password" name="newPassword" required autocomplete="new-password">
                <div class="hint">Min 8 chars — must include uppercase, lowercase, number, and special character (@#$%^&+=!_)</div>
            </div>

            <div class="field-group">
                <label>CONFIRM NEW PASSWORD</label>
                <input type="password" name="confirmPassword" required autocomplete="new-password">
            </div>

            <button type="submit" class="submit-btn">UPDATE PASSWORD</button>
        </form>
    </div>
</div>

</body>
</html>
