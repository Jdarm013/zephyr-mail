<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <title>ZephyrMail | Contacts</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #00ffcc; font-family: 'Courier New', Courier, monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: rgba(10, 10, 12, 0.95); border-right: 1px solid #00ffcc; display: flex; flex-direction: column; padding: 20px; box-shadow: 2px 0 15px rgba(0, 255, 204, 0.1); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5em; text-align: center; margin-bottom: 40px; text-shadow: 0 0 8px rgba(0, 255, 204, 0.5); letter-spacing: 2px; }
        .nav-item { padding: 15px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; text-decoration: none; color: #00ffcc; display: block; }
        .nav-item:hover, .nav-item.active { border: 1px solid #00ffcc; background-color: rgba(0, 255, 204, 0.1); }
        .logout-btn { margin-top: auto; padding: 15px; background-color: rgba(255, 51, 51, 0.1); color: #ff3333; border: 1px solid #ff3333; text-align: center; cursor: pointer; text-decoration: none; font-weight: bold; transition: all 0.2s; }
        .logout-btn:hover { background-color: #ff3333; color: #050505; box-shadow: 0 0 10px rgba(255, 51, 51, 0.5); }
        .main-content { flex-grow: 1; padding: 30px; display: flex; flex-direction: column; overflow-y: auto; background-image: linear-gradient(rgba(0, 255, 204, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .module-container { flex-grow: 1; border: 1px solid #333; background-color: rgba(10, 10, 12, 0.8); padding: 20px; margin-bottom: 20px; }
        label { font-size: 0.8em; letter-spacing: 1px; display: block; margin-bottom: 5px; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; background-color: #050505; border: 1px solid #333; color: #00ffcc; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; transition: border 0.3s; }
        input[type="text"]:focus { outline: none; border-color: #00ffcc; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; color: #555; font-size: 0.8em; }
        tr:hover { background-color: rgba(0, 255, 204, 0.05); }
        .form-group { display: flex; gap: 15px; align-items: flex-end; margin-top: 15px; flex-wrap: wrap; }
        .form-group > div { flex: 1; min-width: 150px; }
        button { padding: 10px 20px; background-color: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc; color: #00ffcc; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #00ffcc; color: #050505; }
        .btn-delete { background-color: rgba(255, 51, 51, 0.1); border-color: #ff3333; color: #ff3333; padding: 5px 10px; font-size: 0.7em; }
        .btn-delete:hover { background-color: #ff3333; color: #050505; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar input { flex-grow: 1; margin-bottom: 0; }
        .empty-state { color: #555; text-align: center; margin-top: 30px; }
        .alert-error { color: #ff3333; border: 1px dashed #ff3333; padding: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">ZephyrMail</div>
    <a th:href="@{/inbox}" class="nav-item">INBOX</a>
    <a th:href="@{/compose}" class="nav-item">COMPOSE</a>
    <a th:href="@{/contacts}" class="nav-item active">CONTACTS</a>
    <a th:href="@{/aliases}" class="nav-item">ALIASES</a>
    <a th:href="@{/vault}" class="nav-item">VAULT</a>
    <a th:href="@{/settings}" class="nav-item">SETTINGS</a>
    <a th:href="@{/logout}" class="logout-btn">TERMINATE SESSION</a>
</div>

<div class="main-content">
    <div class="header-bar">
        <h2>> ADDRESS_BOOK: ONLINE</h2>
    </div>

    <div th:if="${error}" class="alert-error">[!] <span th:text="${error}"></span></div>

    <div class="module-container" style="flex-grow: 0;">
        <h3>> ADD CONTACT</h3>
        <form th:action="@{/contacts/add}" method="POST" class="form-group">
            <div>
                <label>EMAIL ADDRESS</label>
                <input type="text" name="emailAddress" required autocomplete="off">
            </div>
            <div>
                <label>DISPLAY NAME</label>
                <input type="text" name="displayName">
            </div>
            <div>
                <label>NOTES</label>
                <input type="text" name="notes">
            </div>
            <button type="submit">ADD</button>
        </form>
    </div>

    <div class="module-container">
        <h3>> CONTACT DIRECTORY</h3>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="SEARCH CONTACTS..." onkeyup="filterContacts()">
        </div>

        <div th:if="${contacts.empty}" class="empty-state">
            [NO CONTACTS IN DIRECTORY]
        </div>

        <table th:unless="${contacts.empty}" id="contactTable">
            <thead>
            <tr>
                <th>EMAIL</th>
                <th>NAME</th>
                <th>NOTES</th>
                <th>ACTION</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="contact : ${contacts}">
                <td th:text="${contact.emailAddress}">user@example.com</td>
                <td th:text="${contact.displayName}">Display Name</td>
                <td th:text="${contact.notes}">Notes</td>
                <td>
                    <form th:action="@{/contacts/delete/{id}(id=${contact.id})}" method="POST" style="display:inline;">
                        <button type="submit" class="btn-delete">REMOVE</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function filterContacts() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#contactTable tbody tr');
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(input) ? '' : 'none';
        });
    }
</script>

</body>
</html>
