spring.application.name=ZephyrMail

# ==========================================
# 1. RESEND OUTBOUND CONFIGURATION
# ==========================================
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
# Read from the hidden .env file!
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
resend.api.key=${RESEND_API_KEY}

# ==========================================
# 2. INBOUND SMTP SERVER (SubEthaSMTP) — local/LAN testing path
# ==========================================
zephyr.mail.inbound.port=2525
zephyr.mail.domain=zephyrlink.net

# ==========================================
# 2b. RESEND INBOUND WEBHOOK — real internet mail, sidesteps residential ISPs
# blocking inbound port 25 (see /api/webhooks/resend)
# ==========================================
resend.webhook.secret=${RESEND_WEBHOOK_SECRET}

# ==========================================
# 3. LOCAL DATABASE (H2 for Email Storage)
# ==========================================
spring.datasource.url=jdbc:h2:file:./zephyr_mail_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
# Read from the hidden .env file!
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.datasource.hikari.maximum-pool-size=20

# ==========================================
# 4. WEB DASHBOARD PORT
# ==========================================
server.port=8080

# ==========================================
# 6. SOCKS5 PROXY (defaults to localhost — override in .env for production)
# ==========================================
socks5.proxy.host=${SOCKS5_PROXY_HOST:localhost}
socks5.proxy.port=${SOCKS5_PROXY_PORT:1080}

# ==========================================
# 7. MISC
# ==========================================
spring.batch.jdbc.initialize-schema=always
cloudflare.turnstile.secret=${CLOUDFLARE_TURNSTILE_SECRET}
cloudflare.turnstile.sitekey=${CLOUDFLARE_TURNSTILE_SITEKEY}
